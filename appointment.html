<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AKSH Appointment</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

min-height:100vh;

background:
linear-gradient(
180deg,
#10252d,
#23483f,
#304b37
);

color:white;

font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

display:flex;

justify-content:center;

align-items:center;

}


.container{

width:90%;

max-width:500px;

text-align:center;

}


.logo{

font-size:45px;

letter-spacing:12px;

margin-bottom:30px;

}


input,textarea{

width:100%;

margin:10px 0;

padding:16px;

border-radius:25px;

border:none;

background:rgba(255,255,255,.15);

color:white;

font-size:15px;

}


textarea{

height:100px;

resize:none;

}


button{

margin-top:20px;

padding:16px 35px;

border-radius:40px;

border:1px solid rgba(255,255,255,.4);

background:rgba(255,255,255,.15);

color:white;

font-size:16px;

}

</style>

</head>


<body>


<div class="container">


<div class="logo">
AKSH
</div>


<h1>
Request a Session
</h1>


<input id="name" placeholder="Your name">


<input id="email" placeholder="Your email">


<textarea id="message" placeholder="What would you like to talk about?"></textarea>


<button onclick="sendRequest()">
Request Session
</button>


</div>



<script>


function sendRequest(){


let name =
document.getElementById("name").value;


let email =
document.getElementById("email").value;


let message =
document.getElementById("message").value;



let subject =
"AKSH Session Request";


let body =
"Name: "+name+
"\nEmail: "+email+
"\nMessage: "+message;



window.location.href =
"mailto:?subject="+
encodeURIComponent(subject)+
"&body="+
encodeURIComponent(body);


}


</script>



</body>

</html>
