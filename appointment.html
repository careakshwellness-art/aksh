<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AKSH Appointment</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

min-height:100vh;

background:
linear-gradient(
180deg,
#10252d,
#23483f,
#304b37
);

color:white;

font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

display:flex;

justify-content:center;

align-items:center;

}



.menu{

position:fixed;

top:25px;

right:25px;

padding:12px 20px;

border-radius:30px;

background:rgba(255,255,255,.12);

border:1px solid rgba(255,255,255,.3);

color:white;

}



.container{

width:90%;

max-width:500px;

text-align:center;

animation:fade 1.5s ease;

}



.logo{

font-size:45px;

letter-spacing:12px;

margin-bottom:30px;

}



h1{

font-size:28px;

font-weight:500;

margin-bottom:25px;

}



p{

font-size:18px;

line-height:1.6;

opacity:.9;

margin-bottom:35px;

}



input,textarea{

width:100%;

margin:10px 0;

padding:16px;

border-radius:25px;

border:none;

background:rgba(255,255,255,.15);

color:white;

font-size:15px;

}



textarea{

height:100px;

resize:none;

}



button{

margin-top:20px;

padding:16px 35px;

border-radius:40px;

border:1px solid rgba(255,255,255,.4);

background:rgba(255,255,255,.15);

color:white;

font-size:16px;

}



@keyframes fade{

from{

opacity:0;

transform:translateY(30px);

}

to{

opacity:1;

transform:translateY(0);

}

}


</style>

</head>


<body>


<button class="menu" onclick="openMenu()">
☰ Menu
</button>



<div class="container">


<div class="logo">
AKSH
</div>


<h1>
Take your first step.
</h1>


<p>

Choose a time that feels right.
Share what you would like support with.

</p>


<input placeholder="Your name">


<input placeholder="Your email">


<textarea placeholder="What would you like to talk about?"></textarea>


<button>
Request Session
</button>


</div>



<script>

function openMenu(){

window.location.href="menu.html";

}

</script>



</body>

</html>
