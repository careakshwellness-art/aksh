<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Session - AKSH</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

min-height:100vh;

background:
linear-gradient(
180deg,
#081b29,
#173c3b,
#263f32
);

color:white;

font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

display:flex;

justify-content:center;

align-items:center;

}



.container{

width:90%;

max-width:500px;

text-align:center;

animation:fade 1.5s ease;

}



.logo{

font-size:45px;

letter-spacing:12px;

margin-bottom:30px;

}



h1{

font-size:32px;

font-weight:400;

margin-bottom:15px;

}



.subtitle{

font-size:17px;

opacity:.8;

line-height:1.6;

margin-bottom:30px;

}



.form{

background:rgba(255,255,255,.1);

border:1px solid rgba(255,255,255,.2);

border-radius:25px;

padding:25px;

}



input,
textarea,
select{

width:100%;

padding:15px;

margin:10px 0;

border-radius:15px;

border:none;

outline:none;

background:rgba(255,255,255,.9);

font-size:15px;

}



textarea{

height:100px;

resize:none;

}



button{

margin-top:20px;

width:100%;

padding:16px;

border-radius:40px;

border:1px solid rgba(255,255,255,.4);

background:rgba(255,255,255,.15);

color:white;

font-size:16px;

}



button:hover{

background:rgba(255,255,255,.25);

}



.note{

margin-top:20px;

font-size:14px;

opacity:.7;

}



@keyframes fade{

from{

opacity:0;

transform:translateY(30px);

}

to{

opacity:1;

transform:translateY(0);

}

}


</style>

</head>


<body>


<div class="container">


<div class="logo">
AKSH
</div>


<h1>
Book A Session
</h1>


<div class="subtitle">

Take a moment for yourself.
Share what you are experiencing and begin your journey.

</div>



<div class="form">


<input type="text" placeholder="Your Name">


<input type="email" placeholder="Your Email">


<select>

<option>
Choose Session Type
</option>

<option>
I feel anxious
</option>

<option>
I feel overwhelmed
</option>

<option>
I need someone to talk to
</option>

<option>
I am exploring
</option>

</select>



<textarea placeholder="Tell us a little about what brings you here"></textarea>



<button onclick="submitAppointment()">

Request Session

</button>


</div>



<div class="note">

Your information is handled with care and respect.

</div>


</div>



<script>


function submitAppointment(){

window.location.href="appointment-success.html";

}


</script>


</body>

</html>
