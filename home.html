<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AKSH</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

height:100vh;

background:
linear-gradient(
180deg,
#081b29,
#173c3b,
#263f32
);

color:white;

font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

}



.menu{

position:fixed;

top:25px;

right:25px;

padding:12px 20px;

border-radius:30px;

background:rgba(255,255,255,.12);

border:1px solid rgba(255,255,255,.3);

color:white;

font-size:15px;

}



.container{

width:90%;

max-width:500px;

text-align:center;

animation:fade 2s ease;

}


.logo{

font-size:48px;

letter-spacing:15px;

margin-bottom:25px;

}


.message{

font-size:22px;

line-height:1.5;

margin-bottom:35px;

opacity:.9;

}


.question{

font-size:18px;

margin-bottom:20px;

}


button{

width:100%;

padding:17px;

margin:10px 0;

border-radius:40px;

border:1px solid rgba(255,255,255,.3);

background:rgba(255,255,255,.12);

color:white;

font-size:16px;

backdrop-filter:blur(12px);

}


@keyframes fade{

from{

opacity:0;

transform:translateY(30px);

}

to{

opacity:1;

transform:translateY(0);

}

}

</style>

</head>


<body>


<button class="menu" onclick="openMenu()">
☰ Menu
</button>



<div class="container">


<div class="logo">
AKSH
</div>


<div class="message">

A calm space to pause,<br>
reflect and reconnect.

</div>


<div class="question">

What brings you here today?

</div>


<button onclick="openAnxious()">
🌧️ I feel anxious
</button>


<button onclick="openOverwhelmed()">
🌊 I feel overwhelmed
</button>


<button onclick="openTalk()">
💬 I need someone to talk to
</button>


<button onclick="openExploring()">
🌱 I'm just exploring
</button>


</div>



<script>


function openMenu(){

window.location.href="menu.html";

}


function openAnxious(){

window.location.href="anxious.html";

}


function openOverwhelmed(){

window.location.href="overwhelmed.html";

}


function openTalk(){

window.location.href="talk.html";

}


function openExploring(){

window.location.href="exploring.html";

}


</script>


</body>

</html>
