<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AKSH Values</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

min-height:100vh;

background:
linear-gradient(
180deg,
#081b29,
#173c3b,
#263f32
);

color:white;

font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

display:flex;

justify-content:center;

align-items:center;

}



.container{

width:90%;

max-width:600px;

text-align:center;

animation:fade 2s ease;

}


.logo{

font-size:45px;

letter-spacing:12px;

margin-bottom:35px;

}



h1{

font-size:32px;

font-weight:400;

margin-bottom:30px;

}



.card{

background:rgba(255,255,255,.1);

border:1px solid rgba(255,255,255,.2);

border-radius:25px;

padding:20px;

margin:15px 0;

}



.icon{

font-size:30px;

margin-bottom:10px;

}



.title{

font-size:20px;

margin-bottom:8px;

}



.text{

font-size:16px;

line-height:1.6;

opacity:.9;

}



@keyframes fade{

from{

opacity:0;

transform:translateY(30px);

}

to{

opacity:1;

transform:translateY(0);

}

}


</style>

</head>


<body>


<div class="container">


<div class="logo">
AKSH
</div>


<h1>
Our Values
</h1>



<div class="card">

<div class="icon">
🕊️
</div>

<div class="title">
Compassion
</div>

<div class="text">
Every person deserves understanding and kindness.
</div>

</div>



<div class="card">

<div class="icon">
🤝
</div>

<div class="title">
Trust
</div>

<div class="text">
Creating a space where people feel safe to express themselves.
</div>

</div>



<div class="card">

<div class="icon">
🌿
</div>

<div class="title">
Calm
</div>

<div class="text">
Helping people slow down and reconnect.
</div>

</div>



<div class="card">

<div class="icon">
✨
</div>

<div class="title">
Growth
</div>

<div class="text">
Supporting reflection and personal understanding.
</div>

</div>



</div>


</body>

</html>
