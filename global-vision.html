<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Global Vision - AKSH</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

min-height:100vh;

background:
linear-gradient(
180deg,
#020617,
#0f172a,
#134e4a
);

color:white;

font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

display:flex;

justify-content:center;

align-items:center;

}



.container{

width:90%;

max-width:650px;

text-align:center;

animation:fade 2s ease;

}



.logo{

font-size:45px;

letter-spacing:12px;

margin-bottom:35px;

}



h1{

font-size:34px;

font-weight:400;

margin-bottom:30px;

}



.earth{

font-size:80px;

margin:25px 0;

animation:float 4s infinite;

}



p{

font-size:18px;

line-height:1.9;

opacity:.9;

}



.card{

margin-top:30px;

padding:25px;

border-radius:25px;

background:rgba(255,255,255,.1);

border:1px solid rgba(255,255,255,.2);

font-size:20px;

line-height:1.6;

}



@keyframes float{

0%{

transform:translateY(0);

}

50%{

transform:translateY(-15px);

}

100%{

transform:translateY(0);

}

}



@keyframes fade{

from{

opacity:0;

transform:translateY(30px);

}

to{

opacity:1;

transform:translateY(0);

}

}


</style>

</head>


<body>


<div class="container">


<div class="logo">
AKSH
</div>


<h1>
A Vision Beyond Boundaries
</h1>


<div class="earth">
🌍
</div>


<p>

AKSH imagines a world where every person
has a place to pause, reflect, and reconnect.

</p>


<div class="card">

"From one person,
to communities,
to the world."

</div>


</div>


</body>

</html>
