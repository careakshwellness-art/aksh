<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>About AKSH</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

min-height:100vh;

background:
linear-gradient(
180deg,
#081b29,
#173c3b,
#263f32
);

color:white;

font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

display:flex;

justify-content:center;

align-items:center;

}


.container{

width:90%;

max-width:600px;

text-align:center;

animation:fade 2s ease;

}


.logo{

font-size:45px;

letter-spacing:12px;

margin-bottom:35px;

}


h1{

font-size:30px;

margin-bottom:25px;

font-weight:500;

}


p{

font-size:18px;

line-height:1.8;

opacity:.9;

}


button{

margin-top:35px;

padding:16px 30px;

border-radius:40px;

border:1px solid rgba(255,255,255,.4);

background:rgba(255,255,255,.12);

color:white;

font-size:16px;

}



@keyframes fade{

from{

opacity:0;

transform:translateY(30px);

}

to{

opacity:1;

transform:translateY(0);

}

}

</style>

</head>


<body>


<div class="container">


<div class="logo">
AKSH
</div>


<h1>
A space to reconnect with yourself.
</h1>


<p>

AKSH is created as a calm space where people can pause,
express what they feel, and take a step towards clarity.

A place where conversations matter,
and every person's journey is respected.

</p>


<button onclick="openVision()">
Our Vision
</button>


</div>



<script>

function openVision(){

window.location.href="vision.html";

}

</script>


</body>

</html>
