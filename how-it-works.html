<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>How AKSH Works</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

min-height:100vh;

background:
linear-gradient(
180deg,
#081b29,
#173c3b,
#263f32
);

color:white;

font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

display:flex;

justify-content:center;

align-items:center;

}



.container{

width:90%;

max-width:600px;

text-align:center;

animation:fade 2s ease;

}


.logo{

font-size:45px;

letter-spacing:12px;

margin-bottom:35px;

}



h1{

font-size:32px;

font-weight:400;

margin-bottom:30px;

}



.step{

background:rgba(255,255,255,.1);

border:1px solid rgba(255,255,255,.2);

border-radius:25px;

padding:20px;

margin:15px 0;

}



.number{

font-size:25px;

margin-bottom:10px;

}



.title{

font-size:20px;

margin-bottom:8px;

}



.text{

font-size:16px;

line-height:1.6;

opacity:.9;

}



button{

margin-top:25px;

padding:16px 35px;

border-radius:40px;

border:1px solid rgba(255,255,255,.4);

background:rgba(255,255,255,.12);

color:white;

font-size:16px;

}



@keyframes fade{

from{

opacity:0;

transform:translateY(30px);

}

to{

opacity:1;

transform:translateY(0);

}

}


</style>

</head>


<body>


<div class="container">


<div class="logo">
AKSH
</div>


<h1>
How AKSH Works
</h1>


<div class="step">

<div class="number">
01
</div>

<div class="title">
Choose Your Feeling
</div>

<div class="text">
Start by sharing what brings you here today.
</div>

</div>



<div class="step">

<div class="number">
02
</div>

<div class="title">
Have A Conversation
</div>

<div class="text">
A calm space where you can express yourself.
</div>

</div>



<div class="step">

<div class="number">
03
</div>

<div class="title">
Reflect & Reconnect
</div>

<div class="text">
Take a step towards understanding yourself better.
</div>

</div>



<button onclick="openSession()">
Begin Your Journey
</button>



</div>


<script>

function openSession(){

window.location.href="appointment.html";

}

</script>


</body>

</html>
