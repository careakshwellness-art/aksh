<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AKSH - Anxious</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

min-height:100vh;

background:
linear-gradient(
180deg,
#101c35,
#243b55,
#3b5268
);

color:white;

font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

}


.container{

width:90%;

max-width:600px;

text-align:center;

animation:appear 2s ease;

}


.logo{

font-size:45px;

letter-spacing:12px;

margin-bottom:35px;

}


h1{

font-size:32px;

font-weight:400;

margin-bottom:25px;

}


p{

font-size:18px;

line-height:1.8;

opacity:.9;

}



.circle{

width:160px;

height:160px;

border-radius:50%;

background:rgba(255,255,255,.12);

margin:30px auto;

animation:breathe 5s infinite;

}



button{

padding:16px 35px;

border-radius:40px;

border:1px solid rgba(255,255,255,.4);

background:rgba(255,255,255,.12);

color:white;

font-size:16px;

}



@keyframes breathe{

0%{

transform:scale(1);

}

50%{

transform:scale(1.15);

}

100%{

transform:scale(1);

}

}


@keyframes appear{

from{

opacity:0;

transform:translateY(30px);

}

to{

opacity:1;

transform:translateY(0);

}

}


</style>

</head>


<body>


<div class="container">


<div class="logo">
AKSH
</div>


<h1>
It's okay to pause.
</h1>


<div class="circle"></div>


<p>

If your thoughts feel heavy,
take a moment.

You don't have to solve everything at once.

AKSH is a space to slow down,
express what you feel,
and reconnect.

</p>


<button onclick="openSession()">
Talk to Someone
</button>


</div>



<script>

function openSession(){

window.location.href="appointment.html";

}

</script>


</body>

</html>
