<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AKSH - Overwhelmed</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

min-height:100vh;

background:
linear-gradient(
180deg,
#16222a,
#304352,
#556270
);

color:white;

font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

}


.container{

width:90%;

max-width:600px;

text-align:center;

animation:fade 2s ease;

}


.logo{

font-size:45px;

letter-spacing:12px;

margin-bottom:35px;

}


h1{

font-size:32px;

font-weight:400;

line-height:1.4;

margin-bottom:25px;

}


p{

font-size:18px;

line-height:1.8;

opacity:.9;

}


.wave{

width:220px;

height:80px;

margin:35px auto;

border-radius:50%;

border:2px solid rgba(255,255,255,.4);

animation:wave 3s infinite;

}



button{

margin-top:30px;

padding:16px 35px;

border-radius:40px;

border:1px solid rgba(255,255,255,.4);

background:rgba(255,255,255,.12);

color:white;

font-size:16px;

}



@keyframes wave{

0%{

transform:scale(.8);

opacity:.4;

}

50%{

transform:scale(1.2);

opacity:1;

}

100%{

transform:scale(.8);

opacity:.4;

}

}



@keyframes fade{

from{

opacity:0;

transform:translateY(30px);

}

to{

opacity:1;

transform:translateY(0);

}

}


</style>

</head>


<body>


<div class="container">


<div class="logo">
AKSH
</div>


<h1>
You don't have to carry everything alone.
</h1>


<div class="wave"></div>


<p>

When everything feels too much,
take one moment at a time.

AKSH gives you a space to slow down,
organize your thoughts,
and find clarity.

</p>


<button onclick="openSession()">
Find Support
</button>


</div>



<script>

function openSession(){

window.location.href="appointment.html";

}

</script>


</body>

</html>
