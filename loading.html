<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AKSH Loading</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

height:100vh;

background:
radial-gradient(circle,
#173c3b,
#081b29
);

display:flex;

justify-content:center;

align-items:center;

color:white;

font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

overflow:hidden;

}



.container{

text-align:center;

animation:appear 2s ease;

}



.logo{

font-size:70px;

letter-spacing:25px;

animation:pulse 3s infinite;

}



.line{

width:120px;

height:2px;

background:rgba(255,255,255,.5);

margin:30px auto;

animation:expand 3s infinite;

}



.text{

font-size:16px;

letter-spacing:3px;

opacity:.8;

}



@keyframes appear{

from{

opacity:0;

transform:scale(.8);

}

to{

opacity:1;

transform:scale(1);

}

}



@keyframes pulse{

0%{

opacity:.5;

}

50%{

opacity:1;

}

100%{

opacity:.5;

}

}



@keyframes expand{

0%{

width:30px;

}

50%{

width:180px;

}

100%{

width:30px;

}

}


</style>

</head>


<body>


<div class="container">


<div class="logo">
AKSH
</div>


<div class="line"></div>


<div class="text">
A SPACE TO UNDERSTAND
</div>


</div>



<script>

setTimeout(function(){

window.location.href="index.html";

},4000);

</script>


</body>

</html>
