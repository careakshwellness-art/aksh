<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AKSH</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(180deg,#87CEEB 0%,#B8E6FF 40%,#FFF6E5 100%);
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

.cloud{
position:absolute;
background:white;
opacity:.6;
border-radius:100px;
filter:blur(2px);
animation:float 45s linear infinite;
}

.c1{
width:220px;
height:70px;
top:12%;
left:-250px;
}

.c2{
width:160px;
height:55px;
top:35%;
left:-180px;
animation-duration:60s;
}

.c3{
width:280px;
height:80px;
top:65%;
left:-300px;
animation-duration:75s;
}

@keyframes float{
from{
transform:translateX(0);
}
to{
transform:translateX(calc(100vw + 600px));
}
}

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.18);
display:flex;
justify-content:center;
align-items:center;
}

.card{
text-align:center;
padding:30px;
backdrop-filter:blur(10px);
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.25);
border-radius:30px;
width:90%;
max-width:360px;
}

h1{
font-size:60px;
font-weight:300;
letter-spacing:18px;
color:white;
margin-bottom:12px;
}

p{
color:white;
opacity:.95;
margin-bottom:30px;
line-height:1.5;
}

button{
width:100%;
padding:16px;
margin-top:12px;
border:none;
border-radius:50px;
background:rgba(255,255,255,.15);
color:white;
font-size:16px;
backdrop-filter:blur(10px);
}
</style>
</head>

<body>

<div class="cloud c1"></div>
<div class="cloud c2"></div>
<div class="cloud c3"></div>

<div class="overlay">

<div class="card">

<h1>AKSH</h1>

<p>A place beyond the ordinary.</p>

<button>Enter AKSH</button>

<button>Skip to Website</button>

<button>Sound</button>

</div>

</div>

</body>
</html>
