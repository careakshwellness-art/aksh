<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AKSH</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
overflow:hidden;
background:black;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

video{
position:fixed;
width:100%;
height:100%;
object-fit:cover;
}

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,0.35);
}

.content{
position:absolute;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
color:white;
text-align:center;
}

.logo{
font-size:70px;
letter-spacing:22px;
font-weight:300;
}

button{
width:230px;
padding:15px;
margin-top:15px;
border-radius:50px;
border:1px solid rgba(255,255,255,.5);
background:rgba(255,255,255,.15);
color:white;
font-size:16px;
}

</style>
</head>

<body>

<video autoplay muted loop playsinline>
<source src="aksh-intro.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="content">

<div class="logo">
AKSH
</div>

<button>
Enter AKSH
</button>

<button>
Skip to Website
</button>

<button>
Sound
</button>

</div>

</body>
</html>
