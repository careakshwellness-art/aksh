<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AKSH</title>

<style>
html,body{
margin:0;
height:100%;
overflow:hidden;
background:#000;
}

canvas{
display:block;
}
</style>
</head>

<body>

<script type="importmap">
{
"imports":{
"three":"https://unpkg.com/three@0.168.0/build/three.module.js"
}
}
</script>

<script type="module">

import * as THREE from "three";


const scene = new THREE.Scene();

scene.background = new THREE.Color(0x4f86b8);



const camera = new THREE.PerspectiveCamera(
60,
innerWidth/innerHeight,
0.1,
1000
);

camera.position.set(0,0,8);



const renderer = new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
innerWidth,
innerHeight
);

renderer.setPixelRatio(devicePixelRatio);

document.body.appendChild(renderer.domElement);


// SUN GLOW

const sun = new THREE.Mesh(
new THREE.SphereGeometry(1.3,64,64),
new THREE.MeshBasicMaterial({
color:0xffd58a
})
);

sun.position.set(0,2,-10);

scene.add(sun);


const glow = new THREE.PointLight(
0xffd58a,
8,
100
);

glow.position.copy(sun.position);

scene.add(glow);


// CLOUD LAYERS

const cloudLayers=[];


for(let i=0;i<5;i++){

const cloud = new THREE.Mesh(

new THREE.PlaneGeometry(
12,
3
),

new THREE.MeshBasicMaterial({
color:0xffffff,
transparent:true,
opacity:0.18,
side:THREE.DoubleSide
})

);


cloud.position.z=-i*5-5;

cloud.position.y=2-i*0.5;

scene.add(cloud);

cloudLayers.push(cloud);

}


// HORIZON

const horizon = new THREE.Mesh(

new THREE.PlaneGeometry(
30,
8
),

new THREE.MeshBasicMaterial({
color:0x8fc8e8
})

);


horizon.position.set(
0,
-4,
-15
);


scene.add(horizon);



// PARTICLES

const particleGeo =
new THREE.BufferGeometry();

const positions=[];


for(let i=0;i<300;i++){

positions.push(
(Math.random()-0.5)*20,
(Math.random()-0.5)*10,
(Math.random()*-30)
);

}


particleGeo.setAttribute(
"position",
new THREE.Float32BufferAttribute(
positions,
3
)
);


const particles=new THREE.Points(

particleGeo,

new THREE.PointsMaterial({
color:0xffffff,
size:0.03,
transparent:true,
opacity:0.5
})

);


scene.add(particles);



// ANIMATION

function animate(){

requestAnimationFrame(animate);


// camera flying forward

camera.position.z-=0.003;


if(camera.position.z < 2){
camera.position.z=8;
}


// cloud movement

cloudLayers.forEach((c,i)=>{
c.position.x +=0.001*(i+1);
});


particles.rotation.y+=0.0005;



renderer.render(
scene,
camera
);

}


animate();



window.addEventListener(
"resize",
()=>{

camera.aspect=
innerWidth/innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
innerWidth,
innerHeight
);

});


</script>

</body>
</html>
