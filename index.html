<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AKSH</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:black;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}


video{

position:fixed;

top:50%;
left:50%;

transform:translate(-50%,-50%);

width:100%;
height:100%;

object-fit:contain;

background:black;

}



.logo{

position:fixed;

top:45px;

width:100%;

text-align:center;

color:white;

font-size:42px;

letter-spacing:12px;

opacity:0;

animation:showLogo 3s forwards;

text-shadow:0 0 25px rgba(255,255,255,.8);

}



@keyframes showLogo{

from{
opacity:0;
transform:translateY(-20px);
}

to{
opacity:1;
transform:translateY(0);
}

}




.screen{

position:fixed;

inset:0;

display:flex;

justify-content:center;

align-items:center;

}




.controls{

position:fixed;

bottom:45px;

width:100%;

display:none;

justify-content:center;

flex-wrap:wrap;

animation:buttons 1.5s forwards;

}



@keyframes buttons{

from{
opacity:0;
transform:translateY(30px);
}

to{
opacity:1;
transform:translateY(0);
}

}




button{

margin:8px;

padding:15px 28px;

border-radius:50px;

border:1px solid rgba(255,255,255,.4);

background:rgba(0,0,0,.35);

color:white;

font-size:15px;

backdrop-filter:blur(15px);

}



button:active{

transform:scale(.95);

}



</style>

</head>


<body>


<video id="introVideo" playsinline>

<source src="./aksh-intro.MP4" type="video/mp4">

</video>



<div class="logo">
AKSH
</div>



<div class="screen" id="startScreen">

<button onclick="startExperience()">
✨ Begin Experience
</button>

</div>




<div class="controls" id="controls">


<button onclick="muteSound()">
🔇 Sound Off
</button>


<button onclick="skipIntro()">
⏭ Skip
</button>


<button onclick="enterAKSH()">
✨ Enter AKSH
</button>


</div>




<script>


const video=document.getElementById("introVideo");

const startScreen=document.getElementById("startScreen");

const controls=document.getElementById("controls");



function startExperience(){

startScreen.style.display="none";

controls.style.display="flex";

video.muted=false;

video.play();

}



function muteSound(){

video.muted=true;

}



function skipIntro(){

video.pause();

enterAKSH();

}



function enterAKSH(){

window.location.href="home.html";

}



</script>


</body>

</html>
