<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AKSH</title>

<style>
html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
}

canvas{
display:block;
}
</style>

</head>

<body>

<script type="importmap">
{
"imports":{
"three":"https://unpkg.com/three@0.168.0/build/three.module.js"
}
}
</script>

<script type="module">

import * as THREE from "three";


const scene=new THREE.Scene();

scene.background=new THREE.Color(0x75b8e8);



const camera=new THREE.PerspectiveCamera(
60,
innerWidth/innerHeight,
0.1,
1000
);

camera.position.z=8;



const renderer=new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
innerWidth,
innerHeight
);

renderer.setPixelRatio(devicePixelRatio);

document.body.appendChild(renderer.domElement);



// SUN

const sun=new THREE.Mesh(
new THREE.SphereGeometry(1.2,64,64),
new THREE.MeshBasicMaterial({
color:0xffdc91
})
);

sun.position.set(0,2,-8);

scene.add(sun);



const light=new THREE.PointLight(
0xffd89a,
6,
100
);

light.position.copy(sun.position);

scene.add(light);



// CLOUD CREATOR

const cloudGroup=new THREE.Group();


function makeCloud(x,y,z,s){

const group=new THREE.Group();


for(let i=0;i<18;i++){

const puff=new THREE.Mesh(

new THREE.SphereGeometry(
0.35,
16,
16
),

new THREE.MeshBasicMaterial({
color:0xffffff,
transparent:true,
opacity:0.16
})

);


puff.position.set(

(Math.random()-0.5)*2,
(Math.random()-0.5)*0.5,
(Math.random()-0.5)*0.5

);


puff.scale.set(
1.8,
0.5,
1
);


group.add(puff);

}


group.position.set(x,y,z);

group.scale.setScalar(s);


cloudGroup.add(group);

}



makeCloud(-3,1,-5,2);
makeCloud(2,0,-8,2.5);
makeCloud(-1,-1,-12,3);
makeCloud(4,2,-15,2);

scene.add(cloudGroup);



// FLOATING MIST

const mistGeo=new THREE.BufferGeometry();

const mist=[];


for(let i=0;i<200;i++){

mist.push(
(Math.random()-0.5)*15,
(Math.random()-0.5)*8,
- Math.random()*20
);

}


mistGeo.setAttribute(
"position",
new THREE.Float32BufferAttribute(mist,3)
);


const mistParticles=new THREE.Points(

mistGeo,

new THREE.PointsMaterial({
color:0xffffff,
size:0.04,
transparent:true,
opacity:0.35
})

);


scene.add(mistParticles);



// ANIMATION

function animate(){

requestAnimationFrame(animate);


cloudGroup.position.x+=0.002;

if(cloudGroup.position.x>2){
cloudGroup.position.x=-2;
}


camera.position.z-=0.002;


if(camera.position.z<5){
camera.position.z=8;
}


mistParticles.rotation.y+=0.0004;


renderer.render(
scene,
camera
);

}


animate();



window.addEventListener(
"resize",
()=>{

camera.aspect=innerWidth/innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
innerWidth,
innerHeight
);

});

</script>

</body>
</html>
