<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AKSH | Welcome</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="intro-page">

<!-- Mobile Poster -->

<img
id="poster-mobile"
class="intro-poster"
src="intro-mobile.png.PNG"
alt="AKSH Mobile Intro">

<!-- Tablet Poster -->

<img
id="poster-tablet"
class="intro-poster"
src="intro-tablet.png.PNG"
alt="AKSH Tablet Intro">

<!-- Desktop Poster -->

<img
id="poster-desktop"
class="intro-poster"
src="intro-desktop.png.PNG"
alt="AKSH Desktop Intro">

<!-- Large Display Poster -->

<img
id="poster-large"
class="intro-poster"
src="intro-large-display.png.PNG"
alt="AKSH Large Display Intro">

<!-- Intro Video -->

<video

id="introVideo"

autoplay

muted

playsinline

>

<source src="aksh-intro.MOV" type="video/quicktime">

</video>

<!-- Controls -->

<div class="intro-controls">

<button id="soundButton">

🔇 Sound Off

</button>

<button id="skipButton">

⏭ Skip Intro

</button>

<a href="home.html" id="enterButton">

Enter AKSH →

</a>

</div>

<!-- Overlay Content -->

<div class="intro-overlay">

<div class="video-frame">

<!-- The video is positioned over the poster using CSS -->

</div>

</div>

</div>

<script src="script.js"></script>

</body>

</html>
