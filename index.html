<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AKSH</title>

<style>
html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
}

canvas{
display:block;
}
</style>
</head>

<body>

<script type="importmap">
{
 "imports":{
  "three":"https://unpkg.com/three@0.168.0/build/three.module.js"
 }
}
</script>

<script type="module">

import * as THREE from "three";

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x071526);

const camera = new THREE.PerspectiveCamera(
60,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.z = 6;

const renderer = new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

renderer.setPixelRatio(
window.devicePixelRatio
);

document.body.appendChild(renderer.domElement);


// SUN LIGHT

const sunLight = new THREE.PointLight(
0xffd89c,
4,
100
);

sunLight.position.set(
0,
2,
-3
);

scene.add(sunLight);


// SUN

const sunGeometry =
new THREE.SphereGeometry(
1,
64,
64
);

const sunMaterial =
new THREE.MeshBasicMaterial({
color:0xffd27a
});

const sun =
new THREE.Mesh(
sunGeometry,
sunMaterial
);

sun.position.set(
0,
2,
-5
);

scene.add(sun);


// CLOUDS

const cloudGroup = new THREE.Group();

for(let i=0;i<20;i++){

const cloudGeometry =
new THREE.SphereGeometry(
0.35,
16,
16
);

const cloudMaterial =
new THREE.MeshBasicMaterial({
color:0xffffff,
transparent:true,
opacity:0.25
});

const cloud =
new THREE.Mesh(
cloudGeometry,
cloudMaterial
);

cloud.position.set(
(Math.random()-0.5)*8,
(Math.random()-0.5)*3,
-2-Math.random()*5
);

cloud.scale.set(
2+Math.random(),
0.5,
1
);

cloudGroup.add(cloud);

}

scene.add(cloudGroup);


// PARTICLES

const particles =
new THREE.BufferGeometry();

const count=300;

const positions=[];

for(let i=0;i<count;i++){

positions.push(
(Math.random()-0.5)*10,
(Math.random()-0.5)*6,
(Math.random()-0.5)*10
);

}

particles.setAttribute(
"position",
new THREE.Float32BufferAttribute(
positions,
3
)
);

const particleMaterial =
new THREE.PointsMaterial({
color:0xffffff,
size:0.03,
transparent:true,
opacity:0.5
});

const stars =
new THREE.Points(
particles,
particleMaterial
);

scene.add(stars);


// ANIMATION

function animate(){

requestAnimationFrame(animate);


cloudGroup.rotation.y += 0.0008;

stars.rotation.y += 0.0005;


// slow camera movement

camera.position.y =
Math.sin(Date.now()*0.0003)*0.2;


renderer.render(
scene,
camera
);

}

animate();


// RESIZE

window.addEventListener(
"resize",
()=>{

camera.aspect =
window.innerWidth/window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

});

</script>

</body>
</html>
