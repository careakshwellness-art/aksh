<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AKSH</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
display:flex;
justify-content:center;
align-items:center;
position:relative;
}

.fade{
position:fixed;
inset:0;
background:#000;
animation:fadeIn 6s ease forwards;
}

@keyframes fadeIn{
0%{
opacity:1;
}
100%{
opacity:0;
}
}

</style>

</head>

<body>

<div class="fade"></div>

</body>

</html>
