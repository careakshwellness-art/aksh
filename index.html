<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AKSH</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:black;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}


video{
position:fixed;
width:100%;
height:100%;
object-fit:cover;
}


.overlay{
position:fixed;
inset:0;
display:flex;
justify-content:center;
align-items:flex-end;
padding-bottom:50px;
}


button{
margin:10px;
padding:14px 25px;
border-radius:40px;
border:1px solid rgba(255,255,255,.5);
background:rgba(0,0,0,.35);
color:white;
font-size:15px;
backdrop-filter:blur(10px);
}


</style>

</head>


<body>


<video 
id="introVideo"
autoplay
playsinline>

<source src="./aksh-intro.MP4" type="video/mp4">

</video>



<div class="overlay">

<button onclick="muteVideo()">
🔇 Sound Off
</button>


<button onclick="skipIntro()">
⏭ Skip
</button>


<button onclick="enterAKSH()">
✨ Enter AKSH
</button>


</div>



<script>


const video =
document.getElementById("introVideo");


// try starting with sound

video.muted=false;

video.play().catch(()=>{

// browser may block sound autoplay

video.muted=true;
video.play();

});



function muteVideo(){

video.muted=true;

}



function skipIntro(){

video.pause();

enterAKSH();

}



function enterAKSH(){

window.location.href="home.html";

}



</script>


</body>

</html>
