<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKSH</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
color:white;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

video{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
}

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.45);
z-index:-1;
}

.content{
text-align:center;
padding:30px;
}

h1{
font-size:70px;
letter-spacing:18px;
font-weight:300;
margin-bottom:20px;
}

p{
font-size:18px;
opacity:.9;
margin-bottom:45px;
}

.buttons{
display:flex;
flex-direction:column;
gap:16px;
align-items:center;
}

button{
width:240px;
padding:16px;
border-radius:50px;
border:1px solid rgba(255,255,255,.4);
background:rgba(255,255,255,.08);
backdrop-filter:blur(12px);
color:white;
font-size:16px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:white;
color:black;
}
</style>

</head>

<body>

<video autoplay muted loop playsinline>
<source src="https://cdn.coverr.co/videos/coverr-clouds-above-the-mountains-1567744717246?download=1080p" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="content">

<h1>AKSH</h1>

<p>
A place beyond the ordinary.
</p>

<div class="buttons">

<button>Enter Journey</button>

<button>Skip to Website</button>

<button>Sound</button>

</div>

</div>

</body>
</html>
