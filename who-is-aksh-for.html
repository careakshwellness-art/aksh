<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Who Is AKSH For?</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

min-height:100vh;

background:
linear-gradient(
180deg,
#081b29,
#173c3b,
#263f32
);

color:white;

font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

display:flex;

justify-content:center;

align-items:center;

}


.container{

width:90%;

max-width:600px;

text-align:center;

animation:fade 2s ease;

}


.logo{

font-size:45px;

letter-spacing:12px;

margin-bottom:35px;

}



h1{

font-size:32px;

font-weight:400;

margin-bottom:30px;

}



.card{

background:rgba(255,255,255,.1);

border:1px solid rgba(255,255,255,.2);

border-radius:25px;

padding:20px;

margin:15px 0;

font-size:17px;

line-height:1.6;

}



button{

margin-top:25px;

padding:16px 35px;

border-radius:40px;

border:1px solid rgba(255,255,255,.4);

background:rgba(255,255,255,.12);

color:white;

font-size:16px;

}



@keyframes fade{

from{

opacity:0;

transform:translateY(30px);

}

to{

opacity:1;

transform:translateY(0);

}

}


</style>

</head>


<body>


<div class="container">


<div class="logo">
AKSH
</div>


<h1>
Who Is AKSH For?
</h1>



<div class="card">
🌧️ Someone feeling anxious and looking for calm
</div>


<div class="card">
🌊 Someone feeling overwhelmed and needing space
</div>


<div class="card">
💬 Someone who wants a conversation and to be heard
</div>


<div class="card">
🌱 Someone exploring themselves and seeking clarity
</div>


<div class="card">
🕊️ Anyone who wants a moment to pause and reconnect
</div>



<button onclick="start()">
Start Your Journey
</button>


</div>



<script>

function start(){

window.location.href="home.html";

}

</script>


</body>

</html>
