<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AKSH - Talk</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

min-height:100vh;

background:
linear-gradient(
180deg,
#2b1b3d,
#4a3267,
#6b4f8a
);

color:white;

font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

display:flex;

justify-content:center;

align-items:center;

}



.container{

width:90%;

max-width:600px;

text-align:center;

animation:fade 2s ease;

}


.logo{

font-size:45px;

letter-spacing:12px;

margin-bottom:35px;

}



h1{

font-size:32px;

font-weight:400;

line-height:1.4;

margin-bottom:25px;

}



p{

font-size:18px;

line-height:1.8;

opacity:.9;

}



.person{

width:140px;

height:140px;

border-radius:50%;

margin:35px auto;

background:rgba(255,255,255,.15);

display:flex;

align-items:center;

justify-content:center;

font-size:50px;

animation:pulse 4s infinite;

}



button{

margin-top:30px;

padding:16px 35px;

border-radius:40px;

border:1px solid rgba(255,255,255,.4);

background:rgba(255,255,255,.12);

color:white;

font-size:16px;

}



@keyframes pulse{

0%{

transform:scale(1);

}

50%{

transform:scale(1.08);

}

100%{

transform:scale(1);

}

}



@keyframes fade{

from{

opacity:0;

transform:translateY(30px);

}

to{

opacity:1;

transform:translateY(0);

}

}


</style>

</head>


<body>


<div class="container">


<div class="logo">
AKSH
</div>


<h1>
You don't have to keep it inside.
</h1>


<div class="person">
💬
</div>


<p>

Sometimes we just need a space
where we can express what we feel.

AKSH creates a calm conversation
where you can be heard.

</p>


<button onclick="openSession()">
Start A Conversation
</button>


</div>



<script>

function openSession(){

window.location.href="appointment.html";

}

</script>


</body>

</html>
