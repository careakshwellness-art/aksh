<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AKSH | Intro</title>

<link rel="stylesheet" href="intro.css">

</head>

<body>

<div class="intro-page">

<!-- ==========================
POSTERS
========================== -->

<img
id="poster-mobile"
class="intro-poster"
src="intro-mobile.png.PNG"
alt="AKSH Mobile Intro">

<img
id="poster-tablet"
class="intro-poster"
src="intro-tablet.png.PNG"
alt="AKSH Tablet Intro">

<img
id="poster-desktop"
class="intro-poster"
src="intro-desktop.png.PNG"
alt="AKSH Desktop Intro">

<img
id="poster-large"
class="intro-poster"
src="intro-large-display.png.PNG"
alt="AKSH Large Display Intro">

<!-- ==========================
VIDEO CONTAINER
========================== -->

<div class="video-container">

<video
id="introVideo"
autoplay
muted
playsinline
preload="auto">

<source src="aksh-intro.MOV" type="video/quicktime">
</video>

</div>

<!-- ==========================
CONTROLS
========================== -->

<div class="intro-controls">

<button id="soundButton">

🔇 Sound Off

</button>

<button id="skipButton">

⏭ Skip Intro

</button>

<a
id="enterButton"
href="home.html">

Enter AKSH →

</a>

</div>

<!-- ==========================
OVERLAY
========================== -->

<div class="intro-overlay">

<div class="video-frame"></div>

</div>
</div>

<script src="intro.js"></script>

</body>

</html>
