<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AKSH - Exploring</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

min-height:100vh;

background:
linear-gradient(
180deg,
#12372a,
#2d6a4f,
#52b788
);

color:white;

font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

display:flex;

justify-content:center;

align-items:center;

}



.container{

width:90%;

max-width:600px;

text-align:center;

animation:fade 2s ease;

}


.logo{

font-size:45px;

letter-spacing:12px;

margin-bottom:35px;

}



h1{

font-size:32px;

font-weight:400;

line-height:1.4;

margin-bottom:25px;

}



p{

font-size:18px;

line-height:1.8;

opacity:.9;

}



.seed{

width:130px;

height:130px;

border-radius:50%;

margin:35px auto;

background:rgba(255,255,255,.15);

display:flex;

align-items:center;

justify-content:center;

font-size:55px;

animation:grow 4s infinite;

}



button{

margin-top:30px;

padding:16px 35px;

border-radius:40px;

border:1px solid rgba(255,255,255,.4);

background:rgba(255,255,255,.12);

color:white;

font-size:16px;

}



@keyframes grow{

0%{

transform:scale(.9);

}

50%{

transform:scale(1.12);

}

100%{

transform:scale(.9);

}

}



@keyframes fade{

from{

opacity:0;

transform:translateY(30px);

}

to{

opacity:1;

transform:translateY(0);

}

}


</style>

</head>


<body>


<div class="container">


<div class="logo">
AKSH
</div>


<h1>
Every journey begins with curiosity.
</h1>


<div class="seed">
🌱
</div>


<p>

You don't need to have all the answers.

Explore AKSH at your own pace,
understand yourself better,
and discover what feels right for you.

</p>


<button onclick="openSession()">
Explore Sessions
</button>


</div>



<script>

function openSession(){

window.location.href="sessions.html";

}

</script>


</body>

</html>
