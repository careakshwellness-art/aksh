<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AKSH Mission</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

min-height:100vh;

background:
linear-gradient(
180deg,
#081b29,
#173c3b,
#263f32
);

color:white;

font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

display:flex;

justify-content:center;

align-items:center;

}



.container{

width:90%;

max-width:600px;

text-align:center;

animation:fade 2s ease;

}



.logo{

font-size:45px;

letter-spacing:12px;

margin-bottom:35px;

}



h1{

font-size:32px;

font-weight:400;

margin-bottom:30px;

}



p{

font-size:18px;

line-height:1.8;

opacity:.9;

margin-bottom:25px;

}



.quote{

background:rgba(255,255,255,.1);

border:1px solid rgba(255,255,255,.2);

border-radius:25px;

padding:25px;

font-size:20px;

line-height:1.6;

}



@keyframes fade{

from{

opacity:0;

transform:translateY(30px);

}

to{

opacity:1;

transform:translateY(0);

}

}


</style>

</head>


<body>


<div class="container">


<div class="logo">
AKSH
</div>


<h1>
Our Mission
</h1>


<p>

AKSH exists to create a calm and meaningful space
where people can pause, express themselves,
and reconnect with their inner world.

</p>


<div class="quote">

"To make every person feel heard,
understood, and supported."

</div>


</div>


</body>

</html>
